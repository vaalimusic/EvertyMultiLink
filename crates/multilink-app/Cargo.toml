[package]
name = "multilink-app"
version = "1.1.5"
edition = "2021"

[dependencies]
everty-ui = { path = "../../EvertyUI" }
multilink-core = { path = "../multilink-core" }
multilink-mihomo = { path = "../multilink-mihomo" }
multilink-platform = { path = "../multilink-platform" }
serde_json.workspace = true
serde.workspace = true
winit = "0.30"
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.21.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
libc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"
