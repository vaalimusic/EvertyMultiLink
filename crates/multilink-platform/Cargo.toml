[package]
name = "multilink-platform"
version = "1.1.3"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Networking_WinInet", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Power"] }

